name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint and type-check
        run: npm run lint

      - name: Test
        run: npm run test:ci

      - name: Build package
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook

      # Git-tag installs pack the prepared checkout through the same `files` allowlist, so
      # this still catches a `dist` that didn't get built or files that shouldn't ship.
      - name: Verify the packed contents
        run: npm pack --dry-run
